{% extends "base.html" %}

{% block title %}{{ title }} — StockFlow{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<section class="panel form-panel">
  <form method="POST" class="product-form" novalidate>
    {% set data = form_data if form_data else product %}
    <div class="form-grid">
      <div class="field">
        <label for="name">Product name</label>
        <input type="text" id="name" name="name" required
          value="{{ data.name if data else '' }}">
      </div>
      <div class="field">
        <label for="sku">SKU</label>
        <input type="text" id="sku" name="sku" required
          value="{{ data.sku if data else '' }}" placeholder="e.g. WM-001">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" required list="category-suggestions"
          value="{{ data.category if data else '' }}" placeholder="e.g. Electronics">
        <datalist id="category-suggestions">
          <option value="Electronics">
          <option value="Stationery">
          <option value="Office">
          <option value="Furniture">
          <option value="Accessories">
        </datalist>
      </div>
      <div class="field">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="0" required
          value="{{ data.quantity if data else 0 }}">
      </div>
      <div class="field">
        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" min="0" step="0.01" required
          value="{{ data.price if data else '0.00' }}">
      </div>
      <div class="field field-full">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"
          placeholder="Optional notes about this product">{{ data.description if data and data.description else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('products') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {% if product %}Save changes{% else %}Add product{% endif %}
      </button>
    </div>
  </form>
</section>
{% endblock %}
